<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>area of triangle</title>
    <script src="app.js"></script>
</head>
<body>
    <ul>
        <li>
            <p>Area of Square</p>
            <input type="text" placeholder="length" id="length">
            <button onclick="show1()">Calculate area</button>
            <div id="displaySquare"></div>
        </li>
        <li>
            <p>Area of Triangle</p>
            <input type="text" placeholder="base" id="base">
            <input type="text" placeholder="height" id="height">
            <button onclick="show2()">Calculate area</button>
            <div id="displayTriangle"></div>
        </li>
        <li>
            <p>Area of Circle</p>
            <input type="text" placeholder="radius" id="radius">
            <button onclick="show3()">Calculate area</button>
            <div id="displayCircle"></div>
        </li>
        <li>
            <p>Area of Trapezium</p>
            <input type="text" placeholder="a- length of first parallel side" id="trapa">
            <input type="text" placeholder="b- length of first parallel side" id="trapb">
            <input type="text" placeholder="h- length of first parallel side" id="traph">
            <button onclick="show4()">Calculate area</button>
            <div id="displayTrapezium"></div>
        </li>
    </ul>
</body>
</html>
